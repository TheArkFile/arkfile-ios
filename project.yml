name: Kiwix
options:
  xcodeVersion: 26.0
  deploymentTarget: # ArkFile uses iOS 17 APIs and supports the full iOS 17 family.
    iOS: 17.0
    macOS: 14.6
  generateEmptyDirectories: true
  useTabs: false
  groupSortPosition: top
  postGenCommand: scripts/enable-in-app-purchase-capability.pl

settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    # Build 359 is quarantined because it predates the controlled native-source
    # binding. Production archives, source releases, and uploads start at 360.
    CURRENT_PROJECT_VERSION: 373
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_MODULE_VERIFIER: YES
    MODULE_VERIFIER_SUPPORTED_LANGUAGES: "objective-c objective-c++"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_PREVIEWS: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    SWIFT_OBJC_INTEROP_MODE: objcxx
    SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/Support/Kiwix-Bridging-Header.h
    GCC_C_LANGUAGE_STANDARD: c11
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
    APP_STORE_ID: $(APP_STORE_ID)
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    SWIFT_VERSION: 6

  configs:
    debug:
      DEAD_CODE_STRIPPING: YES
      MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu14++"
    release:
      DEAD_CODE_STRIPPING: YES
      MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu14++"
      VALIDATE_PRODUCT: YES

packages:
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    majorVersion: 8.2.0
  StripeApplePay:
    url: https://github.com/CodeLikeW/stripe-apple-pay
    majorVersion: 25.7.2
  SwiftSystem:
    url: https://github.com/apple/swift-system
    revision: b083113aef646d9d35403ca17e9789b750e42d1d
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    majorVersion: 0.9.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.14.0

targetTemplates:
  ApplicationTemplate:
    type: application
    supportedDestinations: [iOS, macOS]
    entitlements:
      path: Support/Kiwix.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.print: true
    dependencies:
      - framework: CoreKiwix.xcframework
        embed: false
        codeSign: true
      - sdk: SwiftUI.framework
      - sdk: MapKit.framework
      - sdk: WebKit.framework
      - sdk: PDFKit.framework
      - package: MapLibre
        destinationFilters:
          - iOS
      - sdk: StoreKit.framework
      - sdk: Security.framework
      - sdk: NotificationCenter.framework
      - sdk: QuickLook.framework
      - sdk: libsqlite3.tbd
      - sdk: PassKit.framework
        destinationFilters:
          - macOS
      - sdk: SystemConfiguration.framework
      - package: Defaults
      - package: StripeApplePay
        destinationFilters:
          - macOS
      - package: ZIPFoundation
      - package: SwiftSystem
        product: SystemPackage
        destinationFilters: 
          - macOS
    sources:
      - path: App
      - path: Model
      - path: SwiftUI
      - path: ViewModel
      - path: Views
      - path: PrivacyInfo.xcprivacy
        destinationFilters:
          - iOS
      - path: Contents
        includes:
          - Resources
          - Resources/PrivacyInfo.xcprivacy
        destinationFilters:
          - macOS
      - path: content/maps/base
        type: folder
        destinationFilters:
          - iOS
      - path: content/base-sample-content
        type: folder
        destinationFilters:
          - iOS

targets:
  Kiwix:
    templates:
      - ApplicationTemplate
    entitlements:
      properties:
        com.apple.developer.associated-domains:
          - applinks:thearkfile.com
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        MARKETING_VERSION: "3.15.0"
        # One universal purchase and native adaptive experience on iPhone/iPad.
        TARGETED_DEVICE_FAMILY: 1,2
        PRODUCT_NAME: ArkFile
        PRODUCT_BUNDLE_IDENTIFIER: app.arkfile.ios
        ARKFILE_SOURCE_WEBSITE: "https://github.com/TheArkFile/arkfile-ios/releases"
        INFOPLIST_KEY_CFBundleDisplayName: ArkFile
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription[sdk=iphone*]: "ArkFile adds images or videos to your Photos library only when you choose to save them."
        INFOPLIST_FILE: Support/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UILaunchStoryboardName: SplashScreenKiwix.storyboard
    sources:
      # Only these reviewed Support inputs belong to the application target.
      # Build ledgers, public-notice generation input and templates stay outside it.
      - path: Support/Assets.xcassets
      - path: Support/CoreKiwix.modulemap
      - path: Support/Info.plist
      - path: Support/Kiwix-Bridging-Header.h
      - path: Support/LocalString.swift
      - path: Support/injection.js
      - path: Support/ArkFileContentCatalog/content-catalog.json
      - path: Support/ArkFileContentLicenses/content-license-index.json
      - path: Support/ArkFileLocalSharing/local-sharing-disposition-index.json
      - path: Support/ArkFileWeather/noaa-nwr-catalog-v1.json
      - path: Support/OfflineMap/protomaps-light-style.json
      - path: Support/OfflineMap/regions-index.json
      - path: Support/Licenses/gpl-3.0.txt
      - path: Support/Licenses/third-party-licenses.txt
      - path: Support/en.lproj/Localizable.strings
      - path: Dependencies/CoreKiwixNativeNotices
        type: folder
      - path: Kiwix/SplashScreenKiwix.storyboard
        destinationFilters:
          - iOS
    dependencies:
      - target: ArkFileWidgets
        embed: true
        destinationFilters:
          - iOS
    preBuildScripts:
      - name: Validate ArkFile iOS Content Catalog
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/arkfile-build-lite-content-catalog.mjs" --validate-only --skip-title-summaries
      - name: Validate Local Sharing Disposition
        basedOnDependencyAnalysis: false
        script: |
          node "$SRCROOT/scripts/arkfile-build-local-sharing-disposition.mjs" --public-build \
            --validate-only \
            --sample-root "$SRCROOT/content/base-sample-content"
      - name: Validate NOAA Weather Radio Catalog
        basedOnDependencyAnalysis: false
        script: |
          node "$SRCROOT/scripts/arkfile-build-weather-radio-catalog.mjs" --validate-only
  ArkFileWidgets:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.arkfile.ios.widgets
        PRODUCT_NAME: ArkFileWidgets
        INFOPLIST_FILE: WidgetsArkFile/Info.plist
        MARKETING_VERSION: "3.15.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1,2
        SKIP_INSTALL: YES
        SWIFT_VERSION: 6
        SWIFT_OBJC_BRIDGING_HEADER: ""
    sources:
      - path: WidgetsArkFile
      - path: Model/ArkFileContent/ArkFileEssentialsActivity.swift
        createIntermediateGroups: true
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  Kiwix:
    build:
      targets:
        Kiwix: all
    run:
